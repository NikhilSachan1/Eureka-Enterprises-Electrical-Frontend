<p class="mf-destination">
  <i
    class="pi pi-folder-open"
    aria-hidden="true"
  ></i>
  <span>
    New folder in
    <strong>{{ locationLabel() }}</strong>
  </span>
</p>

<form
  [formGroup]="form.formGroup"
  class="form"
>
  <app-input-field
    [formGroup]="form.formGroup"
    [inputFieldConfig]="form.fieldConfigs.name"
  />
</form>
