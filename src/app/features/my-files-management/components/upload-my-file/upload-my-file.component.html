<p class="mf-destination">
  <i
    class="pi pi-cloud-upload"
    aria-hidden="true"
  ></i>
  <span>
    Uploading to
    <strong>{{ locationLabel() }}</strong>
  </span>
</p>

<form
  [formGroup]="form.formGroup"
  class="form"
>
  <app-input-field
    [formGroup]="form.formGroup"
    [inputFieldConfig]="form.fieldConfigs.files"
  />
</form>
