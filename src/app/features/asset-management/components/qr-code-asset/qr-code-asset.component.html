@if (printableAssets().length) {
  <div
    class="qr"
    [class.qr--bulk]="isBulkPreview()"
  >
    @for (item of printableAssets(); track item.id) {
      <div
        #qrPlate
        class="qr__plate"
      >
        <div class="qr__code-wrap">
          <qrcode
            [qrdata]="item.qrData"
            [allowEmptyString]="true"
            [elementType]="'canvas'"
            [errorCorrectionLevel]="'H'"
            [margin]="4"
            [scale]="1"
            [width]="qrWidth"
            [colorDark]="'#000000ff'"
            [colorLight]="'#ffffffff'"
            [imageSrc]="logoPath"
            [imageHeight]="65"
            [imageWidth]="65"
            [alt]="companyName + ' asset QR code'"
            [ariaLabel]="'QR code for ' + item.name"
            [title]="item.name"
            cssClass="qr__canvas"
          />
        </div>

        <div
          class="qr__divider"
          aria-hidden="true"
        ></div>

        <div class="qr__details">
          <p class="qr__name">{{ item.name }}</p>
          @if (item.assetId) {
            <p class="qr__id">{{ item.assetId }}</p>
          }
        </div>
      </div>
    }
  </div>
} @else {
  <p class="qr__empty">Unable to generate QR code for this asset.</p>
}
