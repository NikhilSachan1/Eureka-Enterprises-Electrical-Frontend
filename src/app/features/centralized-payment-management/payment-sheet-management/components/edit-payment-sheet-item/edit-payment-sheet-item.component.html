<form
  [formGroup]="form.formGroup"
  class="form"
>
  <app-input-field
    [formGroup]="form.formGroup"
    [inputFieldConfig]="form.fieldConfigs.amount"
  />

  @if (preview(); as view) {
    <section
      class="edit-preview"
      aria-live="polite"
    >
      <span class="edit-preview__title">How this amount is paid</span>
      <app-payment-sheet-amounts-cell
        [view]="view"
        [fluid]="true"
      />
    </section>
  }

  <app-input-field
    [formGroup]="form.formGroup"
    [inputFieldConfig]="form.fieldConfigs.reason"
  />
</form>
