<ng-template
  #invoiceExpansion
  let-vendor
>
  <section class="vo-layer vo-layer--invoice">
    <header class="vo-layer__head">
      <div class="vo-layer__stub">
        <span class="vo-layer__step">02</span>
        <i [class]="icons.COMMON.FILE"></i>
      </div>
      <div class="vo-layer__meta">
        <p class="vo-layer__crumb">
          {{ vendor.vendorName }}
          <i [class]="icons.COMMON.CHEVRON_RIGHT"></i>
          Invoices
        </p>
        <p class="vo-layer__name">
          Invoices
          <span class="vo-layer__count">{{ vendor.invoiceRows.length }}</span>
        </p>
      </div>
    </header>
    <div class="vo-layer__table">
      <app-data-table
      [tableConfig]="invoiceTable.tableConfig()"
      [tableHeader]="invoiceTable.headers()"
      [tableData]="vendor.invoiceRows"
      [loading]="false"
      [rowActions]="invoiceTable.rowActions()"
      [customBodyTemplates]="{
        docWorkspaceContext: docWorkspaceContext,
        documentReferenceChain: documentReferenceChain,
        invoiceAmountBreakdown: invoiceAmountBreakdown,
        invoiceBookedPaidSummary: invoiceBookedPaidSummary,
      }"
      [rowExpansionTemplate]="bookingExpansion"
      (rowActionClick)="onInvoiceRowAction($event)"
    />
    </div>
  </section>
</ng-template>

<ng-template
  #bookingExpansion
  let-invoice
>
  <section class="vo-layer vo-layer--booking">
    <header class="vo-layer__head">
      <div class="vo-layer__stub">
        <span class="vo-layer__step">03</span>
        <i [class]="icons.COMMON.CALENDAR"></i>
      </div>
      <div class="vo-layer__meta">
        <p class="vo-layer__crumb">
          {{ invoice.invoiceNumber }}
          <i [class]="icons.COMMON.CHEVRON_RIGHT"></i>
          Bookings
        </p>
        <p class="vo-layer__name">
          Bookings
          <span class="vo-layer__count">{{ invoice.bookPayments.length }}</span>
        </p>
      </div>
    </header>
    <div class="vo-layer__table">
      <app-data-table
      [tableConfig]="bookingsTable.tableConfig()"
      [tableHeader]="bookingsTable.headers()"
      [tableData]="invoice.bookPayments"
      [loading]="false"
      [rowActions]="bookingsTable.rowActions()"
      (selectionChange)="onBookPaymentSelectionChange(invoice.id, $event)"
    />
    </div>
  </section>
</ng-template>

<ng-template
  #docWorkspaceContext
  let-row
>
  <app-doc-workspace-context [view]="row.docWorkspaceContext" />
</ng-template>

<ng-template
  #documentReferenceChain
  let-row
>
  <app-doc-reference [root]="row.documentReferenceHierarchy" />
</ng-template>

<ng-template
  #invoiceAmountBreakdown
  let-row
>
  <app-doc-amount [segments]="invoiceTaxGstSegments(row)" />
</ng-template>

<ng-template
  #invoiceBookedPaidSummary
  let-row
>
  <app-doc-amount [segments]="invoiceBookedPaidSegments(row)" />
</ng-template>

<ng-template
  #vendorAmountSummary
  let-row
>
  <app-doc-amount [segments]="vendorAmountSegments(row)" />
</ng-template>

<ng-template
  #vendorDocumentCounts
  let-row
>
  <div class="vendor-outstanding-counts">
    <span class="vendor-outstanding-count vendor-outstanding-count--invoice">
      Invoices
      <strong>{{ row.invoiceCount }}</strong>
    </span>
    <span class="vendor-outstanding-count vendor-outstanding-count--booking">
      Bookings
      <strong>{{ row.bookingCount }}</strong>
    </span>
  </div>
</ng-template>

<app-payment-outstanding-section
  searchPlaceholder="Search by vendor name"
  (searchChange)="onSearchChange($event)"
>
  <app-data-table
    [tableConfig]="vendorTable.tableConfig()"
    [tableHeader]="vendorTable.headers()"
    [tableData]="vendorTable.data()"
    [loading]="vendorTable.loading()"
    [rowActions]="vendorTable.rowActions()"
    [customBodyTemplates]="{
      vendorAmountSummary: vendorAmountSummary,
      vendorDocumentCounts: vendorDocumentCounts,
    }"
    [rowExpansionTemplate]="invoiceExpansion"
    [isRowExpandable]="hasInvoiceRows"
    (filterData)="onTableStateChange($event)"
  />
</app-payment-outstanding-section>
