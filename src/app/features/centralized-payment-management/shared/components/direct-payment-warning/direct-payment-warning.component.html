<div
  class="flex items-start gap-2 rounded-md border border-orange-200 bg-orange-50 px-3 py-2 text-orange-700"
  role="alert"
>
  <i
    [class]="ICONS.COMMON.EXCLAMATION_TRIANGLE"
    class="mt-0.5 shrink-0 text-sm"
    aria-hidden="true"
  ></i>
  <div class="text-sm leading-snug">
    <p class="m-0 font-semibold">{{ WARNING.TITLE }}</p>
    <p class="m-0">{{ WARNING.MESSAGE }}</p>
  </div>
</div>
