<app-page-header [pageHeaderConfig]="pageHeaderConfig()" />

<div class="search-filter-wrapper">
  <app-search-filter
    [searchFilterConfig]="searchFilterConfig()"
    [visibleFieldNames]="visibleFilterFieldNames()"
    [prefillValues]="filterPrefillValues()"
    (formReady)="onFilterFormReady($event)"
    (onFilterSubmit)="onFilterSubmit($event)"
    (onFilterReset)="onFilterReset()"
  />
</div>

@if (showOverviewPanel() && selectedProjectId()) {
  <section
    class="ws-overview"
    [class.ws-overview--collapsed]="!overviewExpanded()"
  >
    <div class="ws-overview__strip">
      <app-project-workspace-info-card
        class="ws-overview__info"
        [overview]="projectOverview()"
        [loading]="isProjectOverviewLoading()"
      />
      <button
        type="button"
        class="ws-overview__toggle"
        [attr.aria-expanded]="overviewExpanded()"
        [attr.aria-label]="
          overviewExpanded() ? 'Hide document status and activity' : 'Show document status and activity'
        "
        [pTooltip]="overviewExpanded() ? 'Hide details' : 'Show document status and activity'"
        tooltipPosition="left"
        (click)="toggleOverview()"
      >
        <i
          class="pi"
          [class.pi-chevron-up]="overviewExpanded()"
          [class.pi-chevron-down]="!overviewExpanded()"
          aria-hidden="true"
        ></i>
      </button>
    </div>

    @if (overviewExpanded()) {
      <div
        class="ws-overview__tiles"
        [class.ws-overview__tiles--single]="!canViewProjectTimeline()"
      >
        <div class="ws-overview__tile">
          <app-project-document-status-block
            [projectId]="selectedProjectId() ?? null"
            [overview]="projectOverview()"
            [showHeader]="true"
            logSource="project-workspace"
          />
        </div>
        @if (canViewProjectTimeline()) {
          <div class="ws-overview__tile">
            <app-get-project-timeline [projectId]="selectedProjectId()!" />
          </div>
        }
      </div>
    }
  </section>
}

<div class="project-workspace-main min-w-0 max-w-full">
  <app-nav-tabs
    class="block min-w-0 max-w-full"
    [tabs]="visibleWorkspaceTabs()"
    [tabMode]="tabModeType"
  />
</div>
