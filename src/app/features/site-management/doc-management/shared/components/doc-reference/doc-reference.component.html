@let nodes = flatNodes();
@if (!nodes.length) {
  <span class="doc-ref__empty">—</span>
} @else {
  <ol
    class="doc-ref"
    aria-label="Document reference chain"
  >
    @for (node of nodes; track node.kind; let last = $last) {
      <li
        class="doc-ref__step"
        [class.doc-ref__step--current]="last"
        [attr.data-tone]="tone(node.kind)"
      >
        <span
          class="doc-ref__dot"
          aria-hidden="true"
        ></span>
        <span class="doc-ref__label">{{ label(node) }}</span>
        <span
          class="doc-ref__val"
          [attr.title]="node.value"
        >
          {{ node.value }}
        </span>
      </li>
    }
  </ol>
}
