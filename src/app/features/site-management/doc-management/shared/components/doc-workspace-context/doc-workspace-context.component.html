@let ctx = view();

<div class="ws">
  <div class="ws__head">
    <div class="ws__titles">
      <span
        class="ws__project"
        [attr.title]="ctx.projectName"
      >
        {{ ctx.projectName }}
      </span>
      @if (ctx.siteLocationSubtitle) {
        <span class="ws__location">
          <i
            class="pi pi-map-marker"
            aria-hidden="true"
          ></i>
          {{ ctx.siteLocationSubtitle }}
        </span>
      }
    </div>
  </div>

  @if (companyName() || partyName()) {
    <dl class="ws__parties">
      @if (companyName(); as company) {
        <div class="ws__party">
          <dt class="ws__tag ws__tag--client">Client</dt>
          <dd
            class="ws__name"
            [attr.title]="company"
          >
            {{ company }}
          </dd>
        </div>
      }
      @if (partyName(); as party) {
        <div class="ws__party">
          <dt
            class="ws__tag"
            [attr.data-tone]="partyTone()"
          >
            {{ partyLabel() }}
          </dt>
          <dd
            class="ws__name"
            [attr.title]="party"
          >
            {{ party }}
          </dd>
        </div>
      }
    </dl>
  }
</div>
