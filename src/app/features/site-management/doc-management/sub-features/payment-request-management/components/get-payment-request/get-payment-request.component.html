<app-page-header
  [pageHeaderConfig]="pageHeaderConfig()"
  (headerButtonClick)="onHeaderButtonClick($event)"
  (onSearch)="onSearchChange($event)"
/>

<app-data-table
  #dataTable
  [tableConfig]="table.tableConfig()"
  [tableHeader]="table.headers()"
  [tableData]="table.data()"
  [loading]="table.loading()"
  [bulkActionButtons]="table.bulkActions()"
  [rowActions]="table.rowActions()"
  [customBodyTemplates]="{
    docWorkspaceContext: docWorkspaceContext,
    paymentRequestInvoice: paymentRequestInvoice,
    paymentRequestPo: paymentRequestPo,
    paymentRequestAmounts: paymentRequestAmounts,
  }"
  (rowActionClick)="handlePaymentRequestTableActionClick($any($event))"
  (filterData)="onTableStateChange($event)"
/>

<ng-template
  #docWorkspaceContext
  let-row
>
  <app-doc-workspace-context [view]="row.docWorkspaceContext" />
</ng-template>

<ng-template
  #paymentRequestInvoice
  let-row
>
  <ng-container
    *ngTemplateOutlet="linkedDocCard; context: { $implicit: row.invoiceDoc }"
  />
</ng-template>

<ng-template
  #paymentRequestPo
  let-row
>
  <ng-container
    *ngTemplateOutlet="linkedDocCard; context: { $implicit: row.poDoc }"
  />
</ng-template>

<ng-template
  #linkedDocCard
  let-doc
>
  <div class="pr-linked-doc">
    <div class="pr-linked-doc__line">
      <span class="pr-linked-doc__label">Number:</span>
      <span class="pr-linked-doc__value">{{ doc.number }}</span>
    </div>
    <div class="pr-linked-doc__line">
      <span class="pr-linked-doc__label">Date:</span>
      <span class="pr-linked-doc__value">{{ formatLinkedDocDate(doc.date) }}</span>
    </div>
    <app-doc-amount [segments]="doc.amountSegments" />
  </div>
</ng-template>

<ng-template
  #paymentRequestAmounts
  let-row
>
  <app-doc-amount [segments]="docPaymentRequestAmountSegments(row)" />
</ng-template>
