<app-page-header
  [pageHeaderConfig]="pageHeaderConfig()"
  (headerButtonClick)="onHeaderButtonClick($event)"
  (onSearch)="onSearchChange($event)"
/>

<app-data-table
  #dataTable
  [tableConfig]="table.tableConfig()"
  [tableHeader]="table.headers()"
  [tableData]="table.data()"
  [loading]="table.loading()"
  [bulkActionButtons]="table.bulkActions()"
  [rowActions]="table.rowActions()"
  [customBodyTemplates]="{
    docWorkspaceContext: docWorkspaceContext,
    advancePaymentPo: advancePaymentPo,
    advancePaymentAmounts: advancePaymentAmounts,
  }"
  (rowActionClick)="handleAdvancePaymentTableActionClick($any($event))"
  (filterData)="onTableStateChange($event)"
/>

<ng-template
  #docWorkspaceContext
  let-row
>
  <app-doc-workspace-context [view]="row.docWorkspaceContext" />
</ng-template>

<ng-template
  #advancePaymentPo
  let-row
>
  <ng-container
    *ngTemplateOutlet="linkedDocCard; context: { $implicit: row.poDoc }"
  />
</ng-template>

<ng-template
  #linkedDocCard
  let-doc
>
  <div class="ap-linked-doc">
    <div class="ap-linked-doc__line">
      <span class="ap-linked-doc__label">Number:</span>
      <span class="ap-linked-doc__value">{{ doc.number }}</span>
    </div>
    <div class="ap-linked-doc__line">
      <span class="ap-linked-doc__label">Date:</span>
      <span class="ap-linked-doc__value">{{ formatLinkedDocDate(doc.date) }}</span>
    </div>
    @if (doc.amountSegments?.length) {
      <app-doc-amount [segments]="doc.amountSegments" />
    }
  </div>
</ng-template>

<ng-template
  #advancePaymentAmounts
  let-row
>
  <app-doc-amount [segments]="docAdvancePaymentAmountSegments(row)" />
</ng-template>
