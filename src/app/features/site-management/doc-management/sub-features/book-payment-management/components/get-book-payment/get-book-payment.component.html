<ng-template
  #docWorkspaceContext
  let-row
>
  <app-doc-workspace-context [view]="row.docWorkspaceContext" />
</ng-template>

<ng-template
  #bookPaymentLockStatus
  let-row
>
  <app-unlock-request
    [isLocked]="row.isLocked"
    [requestedAt]="row.unlockRequestedAt"
    [requestedByUser]="row.unlockRequestedByUser"
    [reason]="row.unlockReason"
  />
</ng-template>

<ng-template
  #bookPaymentDocumentReference
  let-row
>
  <app-doc-reference [root]="row.documentReferenceHierarchy" />
</ng-template>

<app-page-header
  [pageHeaderConfig]="pageHeaderConfig()"
  (headerButtonClick)="onHeaderButtonClick($event)"
>
  <div
    headerFilter
    class="book-payment-header-filters"
  >
    <p-iconfield class="book-payment-header-filters__search">
      <p-inputicon class="pi pi-search" />
      <input
        pInputText
        type="text"
        [(ngModel)]="searchInput"
        (ngModelChange)="onSearchInput($event)"
        placeholder="Search by Invoice / Advance Number"
        class="w-full"
      />
    </p-iconfield>
    <app-input-field
      [inputFieldConfig]="paymentTypeFilterFieldConfig"
      [fieldValue]="selectedPaymentType()"
      (onFieldChange)="onPaymentTypeFilterChange($event)"
    />
    <app-input-field
      [inputFieldConfig]="transferFilterFieldConfig"
      [fieldValue]="selectedTransfer()"
      (onFieldChange)="onTransferFilterChange($event)"
    />
  </div>
</app-page-header>

<app-workspace-doc-metrics
  kind="bookPayment"
  [side]="docRouteContext() ?? null"
/>

<app-data-table
  #dataTable
  [tableConfig]="table.tableConfig()"
  [tableHeader]="table.headers()"
  [tableData]="table.data()"
  [loading]="table.loading()"
  [bulkActionButtons]="table.bulkActions()"
  [rowActions]="table.rowActions()"
  [customBodyTemplates]="{
    docWorkspaceContext: docWorkspaceContext,
    bookPaymentDocumentReference: bookPaymentDocumentReference,
    bookPaymentLockStatus: bookPaymentLockStatus,
  }"
  (rowActionClick)="handleBookPaymentTableActionClick($any($event))"
  (filterData)="onTableStateChange($event)"
/>
