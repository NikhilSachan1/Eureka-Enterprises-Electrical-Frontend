<ng-template
  #docWorkspaceContext
  let-row
>
  <app-doc-workspace-context [view]="row.docWorkspaceContext" />
</ng-template>

<ng-template
  #workspaceDocumentStatus
  let-row
>
  <app-workspace-document-status-cell
    [recordId]="row.id"
    scope="jmc"
    [docContext]="docRouteContext()"
    [workspaceContext]="row.docWorkspaceContext"
  />
</ng-template>

<ng-template
  #jmcLockStatus
  let-row
>
  <app-unlock-request
    [isLocked]="row.isLocked"
    [requestedAt]="row.unlockRequestedAt"
    [requestedByUser]="row.unlockRequestedByUser"
    [reason]="row.unlockReason"
  />
</ng-template>

<ng-template
  #documentReferenceChain
  let-row
>
  <app-doc-reference [root]="row.documentReferenceHierarchy" />
</ng-template>

<app-page-header
  [pageHeaderConfig]="pageHeaderConfig()"
  (headerButtonClick)="onHeaderButtonClick($event)"
  (onSearch)="onSearchChange($event)"
/>

<app-data-table
  #dataTable
  [tableConfig]="table.tableConfig()"
  [tableHeader]="table.headers()"
  [tableData]="table.data()"
  [loading]="table.loading()"
  [bulkActionButtons]="table.bulkActions()"
  [rowActions]="table.rowActions()"
  [customBodyTemplates]="{
    docWorkspaceContext: docWorkspaceContext,
    workspaceDocumentStatus: workspaceDocumentStatus,
    jmcLockStatus: jmcLockStatus,
    documentReferenceChain: documentReferenceChain,
  }"
  (rowActionClick)="handleJmcTableActionClick($any($event))"
  (filterData)="onTableStateChange($event)"
  (attachmentClick)="handleAttachmentClick($event)"
/>
