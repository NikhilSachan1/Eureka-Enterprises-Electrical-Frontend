<form
  [formGroup]="form.formGroup"
  class="form"
>
  @if (isPurchase()) {
    <p class="text-sm text-gray-600">
      A GST book payment of the held GST will be created for each selected invoice. Pay it from the payment sheet or
      bank transfer — the GST is marked released once the transfer is done.
    </p>
  } @else {
    <app-input-field
      [formGroup]="form.formGroup"
      [inputFieldConfig]="form.fieldConfigs.utrNumber"
    />
  }

  <app-input-field
    [formGroup]="form.formGroup"
    [inputFieldConfig]="form.fieldConfigs.paymentDate"
  />

  @if (!isPurchase()) {
    <app-input-field
      [formGroup]="form.formGroup"
      [inputFieldConfig]="form.fieldConfigs.paymentAttachment"
    />
  }

  <app-input-field
    [formGroup]="form.formGroup"
    [inputFieldConfig]="form.fieldConfigs.remarks"
  />
</form>
