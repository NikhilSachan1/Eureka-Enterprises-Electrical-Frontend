<app-page-header [pageHeaderConfig]="pageHeaderConfig()" />

<form
  (ngSubmit)="onSubmit()"
  [formGroup]="form.formGroup"
  class="form"
>
  <app-filing-target
    module="fuel"
    [formGroup]="form.formGroup"
    [employeeField]="form.fieldConfigs.employeeName"
    (selectedEmployeeIdChange)="onBehalfEmployeeId.set($event)"
    (targetChange)="onFilingTargetChange($event)"
    (canFileForOthersChange)="canFileForOthers.set($event)"
    (resolvedChange)="managedUsersResolved.set($event)"
  />

  @if (showLinkedVehicle()) {
    <section
      class="fuel-assignment"
      [class.fuel-assignment--filled]="showFuelFields()"
    >
      <app-linked-vehicle-petro-card
        [employeeName]="onBehalfEmployeeId()"
        [prefillFromAppConfiguration]="filingFor() === filingTargets.SELF"
        [redirectRoute]="canFileForOthers() ? null : redirectRoute"
        (linkedUserVehicleDetailChange)="linkedUserVehicleDetail.set($event)"
      />
    </section>
  }

  @if (showFuelFields()) {
  <div class="grid grid-cols-1 md:grid-cols-4">
    <app-input-field
      [formGroup]="form.formGroup"
      [inputFieldConfig]="form.fieldConfigs.fuelFillDate"
    />

    <app-input-field
      [formGroup]="form.formGroup"
      [inputFieldConfig]="form.fieldConfigs.paymentMode"
    />

    <app-fuel-expense-amount-field
      [formGroup]="form.formGroup"
      [fieldConfig]="form.fieldConfigs.fuelAmount"
    />

    @if (form.fieldConfigs.transactionId) {
      <app-input-field
        [formGroup]="form.formGroup"
        [inputFieldConfig]="form.fieldConfigs.transactionId"
      />
    }
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2">
    <app-input-field
      [formGroup]="form.formGroup"
      [inputFieldConfig]="form.fieldConfigs.fuelLiters"
    />

    <app-input-field
      [formGroup]="form.formGroup"
      [inputFieldConfig]="form.fieldConfigs.odometerReading"
    />
  </div>

  <app-input-field
    [formGroup]="form.formGroup"
    [inputFieldConfig]="form.fieldConfigs.remark"
  />

  <app-input-field
    [formGroup]="form.formGroup"
    [inputFieldConfig]="form.fieldConfigs.fuelExpenseAttachments"
  />

  <div class="button-container">
    <app-button
      [buttonConfig]="form.buttonConfigs['reset']"
      (onButtonClick)="onReset()"
    />

    <app-button
      [buttonConfig]="form.buttonConfigs['submit']"
      [showButtonLoader]="isSubmitting()"
    />
  </div>
  }
</form>
