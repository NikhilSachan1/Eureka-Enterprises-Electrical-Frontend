@if (showBanner) {
  @switch (environment) {
    @case (EEnvironment.LOCAL) {
      <div
        class="environment-ribbon environment-ribbon--local"
        role="status"
        aria-label="Local, non-production environment"
      >
        <span
          class="environment-ribbon__band"
          aria-hidden="true"
        >
          Local
        </span>
      </div>
    }
    @case (EEnvironment.DEVELOPMENT) {
      <div
        class="environment-ribbon environment-ribbon--uat"
        role="status"
        aria-label="UAT, non-production environment"
      >
        <span
          class="environment-ribbon__band"
          aria-hidden="true"
        >
          UAT
        </span>
      </div>
    }
  }
}
