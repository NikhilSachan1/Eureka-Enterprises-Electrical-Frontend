@if (showBanner) {
  <div
    [class]="'environment-ribbon environment-ribbon--' + variant"
    role="status"
    [attr.aria-label]="ariaLabel"
  >
    <span
      class="environment-ribbon__band"
      aria-hidden="true"
    >
      <span class="environment-ribbon__app">{{ appLabel }}</span>
      <span class="environment-ribbon__api">API · {{ apiLabel }}</span>
    </span>
  </div>
}
