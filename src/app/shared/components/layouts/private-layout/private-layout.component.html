<app-sidebar>
  <router-outlet />
</app-sidebar>

@if (!authService.isImpersonating()) {
  <app-install-app-banner />
}

@if (authService.isImpersonating()) {
  <div
    role="status"
    class="fixed bottom-4 left-1/2 z-[1200] flex max-w-[calc(100vw-2rem)] -translate-x-1/2 items-center gap-3 rounded-full bg-amber-400 px-4 py-2 text-sm font-medium text-black shadow-lg"
  >
    <i class="pi pi-user" aria-hidden="true"></i>
    <span class="truncate">Signed in as {{ authService.user()?.fullName }}</span>
    <button
      type="button"
      class="shrink-0 cursor-pointer font-semibold underline"
      (click)="authService.stopImpersonation()"
    >
      Exit
    </button>
  </div>
}
