<!-- Only show if user has multiple roles -->
@if (hasMultipleRoles()) {
  <button
    type="button"
    class="role-chip"
    [class.role-chip--collapsed]="isSidebarCollapsed()"
    [disabled]="isSubmitting()"
    (click)="togglePopover($event)"
    [attr.aria-label]="`Switch Role: ${activeRole().name}`"
    [attr.title]="activeRole().name"
  >
    <span class="role-chip__icon">
      <i [class]="ALL_ICONS.COMMON.ID_CARD"></i>
    </span>
    @if (!isSidebarCollapsed()) {
      <span class="role-chip__name">{{ activeRole().name }}</span>
      <i
        [class]="ALL_ICONS.COMMON.SYNC + ' role-chip__sync'"
        [class.spinning]="isSubmitting()"
      ></i>
    }
  </button>

  <!-- Role Selection Popover -->
  <p-popover
    #rolePopover
    [styleClass]="sidebarFooterPopoverClass"
    [dismissable]="true"
    [appendTo]="'body'"
  >
    <div class="role-menu">
      <div class="role-menu-header">
        <i [class]="ALL_ICONS.COMMON.USERS"></i>
        <span>Switch Role</span>
      </div>

      <div class="role-list">
        @for (role of roles(); track role.id) {
          @let isActive = role.id === activeRole().id;
          <button
            type="button"
            class="role-card"
            [class.selected]="isActive"
            [disabled]="isSubmitting()"
            (click)="selectRole(role)"
          >
            <div class="role-card-icon">
              <i [class]="ALL_ICONS.COMMON.ID_CARD"></i>
            </div>
            <span class="role-card-name">{{ role.name }}</span>
            <div class="selection-indicator">
              @if (isActive) {
                <div class="selected-circle">
                  <i [class]="ALL_ICONS.COMMON.CHECK_TICK"></i>
                </div>
              } @else {
                <div class="unselected-circle"></div>
              }
            </div>
          </button>
        }
      </div>
    </div>
  </p-popover>
}
