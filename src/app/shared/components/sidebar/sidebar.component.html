<div
  class="sidebar-layout"
  [ngClass]="{ 'dark-theme-active': themeService.isDarkMode() }"
>
  @if (isMobile()) {
    <button
      type="button"
      class="sidebar-toggle"
      [class.sidebar-toggle--visible]="sidebarVisible()"
      [class.transition-enabled]="transitionEnabled()"
      [attr.aria-expanded]="sidebarVisible()"
      [attr.aria-label]="sidebarVisible() ? 'Hide sidebar' : 'Show sidebar'"
      (click)="toggleSidebar()"
      @fadeInOut
    >
      <i
        class="pi"
        [ngClass]="sidebarVisible() ? 'pi-times' : 'pi-bars'"
      ></i>
    </button>
  }

  <aside
    #sidebarEl
    class="sidebar"
    [ngClass]="{
      'sidebar--expanded': sidebarVisible() || hoverExpanded(),
      'sidebar--collapsed': !sidebarVisible() && !hoverExpanded(),
      'sidebar--overlay': hoverExpanded(),
    }"
    [attr.aria-hidden]="isMobile() && !sidebarVisible() ? true : null"
    [inert]="isMobile() && !sidebarVisible()"
    (mouseenter)="onSidebarMouseEnter()"
    (mouseleave)="onSidebarMouseLeave($event)"
    (focusin)="onSidebarFocusIn()"
    (focusout)="onSidebarFocusOut($event)"
  >
    <app-sidebar-header
      [sidebarVisible]="sidebarVisible()"
      [isMobile]="isMobile()"
      (toggleSidebar)="toggleSidebar()"
    />

    <app-sidebar-user-profile [isSidebarCollapsed]="!sidebarVisible() && !hoverExpanded()" />

    @let collapsed = !sidebarVisible() && !hoverExpanded();
    <button
      type="button"
      class="sidebar-search"
      [class.sidebar-search--collapsed]="collapsed"
      [attr.aria-label]="collapsed ? 'Search pages (' + commandPalette.shortcutLabel + ')' : null"
      [attr.aria-keyshortcuts]="commandPalette.ariaKeyShortcuts"
      (click)="commandPalette.open()"
    >
      <i
        [class]="ICONS.COMMON.SEARCH + ' sidebar-search__icon'"
        aria-hidden="true"
      ></i>
      <span class="sidebar-search__label">Search pages</span>
      <kbd
        class="sidebar-search__kbd"
        aria-hidden="true"
      >
        {{ commandPalette.shortcutLabel }}
      </kbd>
    </button>

    <div class="sidebar-content">
      <app-sidebar-menu [isCollapsed]="!sidebarVisible() && !hoverExpanded()" />
    </div>
  </aside>

  @if (hoverExpanded() && !isMobile()) {
    <div
      class="sidebar-blur-backdrop"
      aria-hidden="true"
    ></div>
  }

  <app-content-area
    [sidebarVisible]="sidebarVisible()"
    [isMobile]="isMobile()"
    [sidebarCollapsed]="!sidebarVisible()"
  >
    <ng-content />
  </app-content-area>

  @if (isMobile() && sidebarVisible()) {
    <div
      class="sidebar-backdrop"
      (click)="toggleSidebar()"
      aria-hidden="true"
    ></div>
  }
</div>
