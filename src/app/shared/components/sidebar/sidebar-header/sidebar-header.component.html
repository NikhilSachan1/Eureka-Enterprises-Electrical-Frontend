<header class="sidebar-header">
  <div
    class="logo-section"
    [class.clickable]="!isMobile()"
    (click)="onHeaderClick()"
    [attr.role]="!isMobile() ? 'button' : null"
    [attr.tabindex]="!isMobile() ? '0' : null"
  >
    <img
      src="assets/logo-256.webp"
      alt="Eureka Logo"
      class="logo"
      loading="lazy"
    />
    <div class="brand">
      <h1>{{ companyName() }}</h1>
      <h2>{{ companyDescription() }}</h2>
    </div>
  </div>
  <app-notification-bell class="sidebar-header__bell" />
  @if (!isMobile() && sidebarVisible()) {
    <button
      type="button"
      class="collapse-btn"
      (click)="$event.stopPropagation(); onHeaderClick()"
      aria-label="Collapse sidebar"
    >
      <i [ngClass]="collapseIcon"></i>
    </button>
  }
</header>
