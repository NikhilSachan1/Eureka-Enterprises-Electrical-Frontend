<div class="chart-container">
  <!-- chart.js loads when the chart scrolls into view. -->
  @defer (on viewport) {
    <app-chart-canvas
      [type]="chartConfig().chartType"
      [data]="chartData()"
      [options]="chartOptions()"
    />
  } @placeholder {
    <div class="chart-loading"></div>
  }
</div>
