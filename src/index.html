<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Theme before first paint – no flash (smooth) -->
    <script>
      (function () {
        var theme = localStorage.getItem('theme');
        var isDark = theme === 'dark';
        var html = document.documentElement;
        if (isDark) {
          html.classList.add('dark-theme');
          html.style.backgroundColor = '#0c1222';
          html.style.color = '#e2e8f0';
        } else {
          html.classList.remove('dark-theme');
          html.style.backgroundColor = '#ffffff';
          html.style.color = '#1e293b';
        }
      })();
    </script>
    <title>Eureka Enterprises - Electrical Management System</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0c1222"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Eureka Electrical"
    />
    <link
      rel="icon"
      href="favicons/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicons/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="manifest.webmanifest"
    />
  </head>
  <body>
    <script>
      (function () {
        var theme = localStorage.getItem('theme');
        var isDark = theme === 'dark';
        var b = document.body;
        if (b) {
          b.style.backgroundColor = isDark ? '#0c1222' : '#ffffff';
          b.style.color = isDark ? '#e2e8f0' : '#1e293b';
        }
      })();
    </script>
    <!-- Angular will replace everything inside app-root when app loads -->
    <app-root>
      <!-- Replaced automatically when Angular bootstraps -->
      <div
        class="boot-loader"
        role="status"
        aria-label="Loading Eureka Enterprises"
      >
        <div class="boot-loader__mark">
          <span class="boot-loader__ring"></span>
          <span class="boot-loader__core">
            <svg
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
            </svg>
          </span>
        </div>
        <div class="boot-loader__title">Eureka Enterprises</div>
        <div class="boot-loader__subtitle">Electrical Management System</div>
        <div class="boot-loader__track"><span class="boot-loader__bar"></span></div>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
